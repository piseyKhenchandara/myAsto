name: 🚀 Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm production deployment'
        required: true
        default: 'NO'

jobs:
  deploy-production:
    name:  Deploy to Production
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DEPLOY'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name:  Deploy to Production VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            COMPOSE="docker-compose -f docker-compose.production.yml"

            cd ${{ secrets.PROJECT_PATH }}

            # Backup database BEFORE deploying
            echo " Backing up database..."
            mkdir -p backups
            BACKUP_DIR="backups/backup_$(date +%Y%m%d_%H%M%S)"
            mkdir -p $BACKUP_DIR
            $COMPOSE exec -T db mysqldump -u root -p${{ secrets.MYSQL_ROOT_PASSWORD }} REDACTED_DB_NAME > $BACKUP_DIR/db_backup.sql
            git rev-parse HEAD > $BACKUP_DIR/commit_hash.txt
            echo "✅ Backup saved!"

            # Pull latest code from main
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            echo " Deploying: $(git log -1 --oneline)"

            # Deploy
            $COMPOSE down || true
            $COMPOSE build --no-cache
            $COMPOSE up -d

            sleep 20
            $COMPOSE ps

            # Health check

            # -s → silent mode (no progress output)
            # -o /dev/null → throw away the response body
            #-w "%{http_code}" → print only the HTTP status code and store in HTTP_CODE
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80)
            if [ $HTTP_CODE -eq 200 ]; then
              echo "✅ Health check passed!"
            else
              echo "❌ Health check failed: HTTP $HTTP_CODE"
              exit 1
            fi

            echo "🎉 DEPLOYMENT COMPLETED!"

      - name: 🆘 Rollback on Failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            COMPOSE="docker-compose -f docker-compose.production.yml"
            cd ${{ secrets.PROJECT_PATH }}


            # ls -t = list folders sorted by newest first
            # head -1 = take only the newest one
            # So now LATEST_BACKUP becomes something like:
            # backup_20260225_210501

            LATEST_BACKUP=$(ls -t backups/ | head -1)
            if [ -f "backups/$LATEST_BACKUP/commit_hash.txt" ]; then
              git reset --hard $(cat backups/$LATEST_BACKUP/commit_hash.txt)
            else
              git reset --hard HEAD~1
            fi

            $COMPOSE down
            $COMPOSE up -d --build
            sleep 15
            $COMPOSE ps
            echo "↩️ ROLLBACK COMPLETE!"

      - name: ✅ Success Notification
        if: success()
        run: |
          echo "🎉 PRODUCTION DEPLOYMENT SUCCESSFUL!"
          echo " Website: http://${{ secrets.VPS_HOST }}"
          echo " Commit: ${{ github.sha }}"

      - name: ❌ Failed Notification
        if: failure()
        run: |
          echo "❌ PRODUCTION DEPLOYMENT FAILED!"
          echo "↩️ Rolled back to previous version"
