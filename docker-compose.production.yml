services:
  # MySQL Database
  db:
    image: mysql:5.7
    platform: linux/amd64
    container_name: myasto_db_prod
    restart: always
    env_file:
      - ./backend/.env
    # No ports exposed - database only accessible internally
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - myasto-network
    healthcheck:

      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      timeout: 20s
      retries: 10

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myasto_backend_prod
    restart: always
    # No ports exposed - only accessible through nginx
    expose:
      - "5000"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - myasto-network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILD_MODE: production
        ENV: production
    container_name: myasto_frontend_prod
    restart: always
    ports:
      - "80:80"                   # Only nginx exposed to public
      # - "443:443"               # For SSL in future
    depends_on:
      - backend
    networks:
      - myasto-network

volumes:
  mysql_data:

networks:
  myasto-network:
    driver: bridge
