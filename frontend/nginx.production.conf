server {
    #listen 443 ssl http2;
    listen 80;
    server_name astogear.com www.astogear.com;

    client_max_body_size 200M;
    
    # ✅ ADD THESE CRITICAL SETTINGS
    client_body_timeout 300s;
    client_header_timeout 300s;
    proxy_connect_timeout 300s;    listen 80;
    proxy_send_timeout 300s;ww.astogear.com;
    proxy_read_timeout 300s;
    send_timeout 300s;
    
    #ssl_certificate /etc/nginx/ssl/fullchain.pem;INGS
    #ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #ssl_protocols TLSv1.2 TLSv1.3;0s;
    #ssl_prefer_server_ciphers on;0s;
 300s;
    root /usr/share/nginx/html;proxy_read_timeout 300s;
    index index.html;

    gzip on;/fullchain.pem;
    gzip_types text/plain text/css application/json application/javascript;x/ssl/privkey.pem;
    #ssl_protocols TLSv1.2 TLSv1.3;
    location / {on;
        try_files $uri $uri/ /index.html;
    }    root /usr/share/nginx/html;
dex.html;
    location /api {
        proxy_pass http://backend:5000;  # Direct connection - simpler    gzip on;
        proxy_http_version 1.1;ext/plain text/css application/json application/javascript;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';ocation / {
        proxy_set_header Host $host;        try_files $uri $uri/ /index.html;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # ✅ ADD THESE FOR UPLOADS
        proxy_request_buffering off;tp_upgrade;
        client_max_body_size 200M;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }ded-Proto $scheme;

    location /socket.io {
        proxy_pass http://backend:5000;  # Direct connection;
        proxy_http_version 1.1;M;
        proxy_set_header Upgrade $http_upgrade;0s;
        proxy_set_header Connection "upgrade";   proxy_send_timeout 300s;
        proxy_set_header X-Real-IP $remote_addr;        proxy_read_timeout 300s;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}    }
}