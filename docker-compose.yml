services:
  # MySQL Database
  db:
    #image: mysql:8.0 for start-up server
    image : mysql:5.7 # for leader plan
    platform: linux/amd64
    container_name: myasto_db
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - myasto-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myasto_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - myasto-network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILD_MODE: production
        ENV: production
    container_name: myasto_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - myasto-network

volumes:
  mysql_data:

networks:
  myasto-network:
    driver: bridge