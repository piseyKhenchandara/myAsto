services:
  # MySQL Database
  db:
    image: mysql:5.7              # Use MySQL version 5.7 (pre-built image, no Dockerfile needed)
    platform: linux/amd64         # Run on AMD64 architecture (for M1/M2 Mac compatibility)
    container_name: myasto_db     # Name the container "myasto_db"
    restart: always               # If container crashes, automatically restart it
    
    env_file:
      - ./backend/.env            # Load environment variables from backend/.env file
                                  # (DB_PASSWORD, DB_NAME, etc.)
    
    # Database only accessible from other containers
    expose:
      - "3306"                      # ✅ Only expose within Docker network
    
    volumes:
      - mysql_data:/var/lib/mysql # Persist database data (survives container restarts)
                                  # Stores data in Docker volume "mysql_data"
    
    networks:
      - myasto-network            # Connect to "myasto-network" so other containers can talk to it
    
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
                                  # Check if MySQL is ready by pinging it
      timeout: 20s                # Wait max 20 seconds for response
      retries: 10                 # Try 10 times before marking as unhealthy

  # Backend Service
  backend:
    build:
      context: ./backend          # Build from ./backend folder
      dockerfile: Dockerfile      # Use ./backend/Dockerfile
    
    container_name: myasto_backend # Name the container "myasto_backend"
    restart: always               # Auto-restart if crashes
  
    # Only accessible within Docker network
    expose:
      - "5000"                      # ✅ Only expose within Docker network
    
    env_file:
      - ./backend/.env            # Load environment variables
    
    environment:
      DB_HOST: db                 # Set DB_HOST=db (points to the "db" service)
                                  # Backend connects to MySQL using "db:3306"
  
    depends_on:
      db:
        condition: service_healthy # Wait for MySQL to be healthy before starting
                                  # Uses the healthcheck above
  
    networks:
      - myasto-network            # Same network as database (can communicate)

  # Frontend Service
  frontend:
  build:
    context: ./frontend         # Build from ./frontend folder
    dockerfile: Dockerfile      # Use ./frontend/Dockerfile
    args:
      BUILD_MODE: production    # Pass BUILD_MODE=production to Dockerfile
      ENV: production           # Pass ENV=production (uses nginx.production.conf)
  
    container_name: myasto_frontend # Name the container "myasto_frontend"
    restart: always               # Auto-restart if crashes
  
    ports:
    - "3000:80"                 # ✅ ONLY expose nginx (entry point)
                                    # This is the ONLY port that should be public
  
    depends_on:
    - backend                   # Wait for backend to start first
  
    networks:
    - myasto-network            # Same network (frontend can call backend:5000)

volumes:
  mysql_data:                   # Creates a named volume "mysql_data"
                                # Stores MySQL database files
                                # Data survives even if you delete containers
networks:
  myasto-network:
    driver: bridge