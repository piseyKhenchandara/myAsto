services:
  # MySQL Database
  db:
  
    image : mysql:5.7
    platform: linux/amd64
    container_name: myasto_db
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "3307:3306"               # ✅ OK for development - database debugging
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - myasto-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myasto_backend
    restart: always
    ports:
      - "5000:5000"               # ✅ OK for development - direct API testing
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - myasto-network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILD_MODE: development
        ENV: development
    container_name: myasto_frontend
    restart: always
    ports:
      - "3000:80"                 # ✅ Main entry point
    depends_on:
      - backend
    networks:
      - myasto-network

volumes:
  mysql_data:

networks:
  myasto-network:
    driver: bridge