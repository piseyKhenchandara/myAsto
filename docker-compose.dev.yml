services:
  db:
    image: mysql:5.7
    platform: linux/amd64
    container_name: myasto_db_dev
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "3307:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
    networks:
      - myasto-dev-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: myasto-backend-dev
    container_name: myasto_backend_dev
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - myasto-dev-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILD_MODE: development
        ENV: development
    image: myasto-frontend-dev
    container_name: myasto_frontend_dev
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - myasto-dev-network

volumes:
  mysql_data_dev:

networks:
  myasto-dev-network:
    driver: bridge